# Описание проекта для XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Файл BPDiary.xcodeproj создаётся из него командой `xcodegen generate`.
name: BPDiary

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

fileGroups:
  - Config

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Версия приложения, видимая в App Store. Номер сборки подставляется при выгрузке.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  BPDiary:
    type: application
    platform: iOS
    sources:
      - path: BPDiary
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        # Идентификатор приложения. При выгрузке в App Store заменяется значением
        # переменной BUNDLE_ID из настроек репозитория GitHub.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bpdiary
        PRODUCT_NAME: BPDiary
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/BPDiary.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  BPDiary:
    build:
      targets:
        BPDiary: all
    run:
      config: Debug
    archive:
      config: Release
