# Выгрузка в App Store Connect (TestFlight). Запускается вручную:
# вкладка Actions → «Выгрузка в TestFlight» → Run workflow.
#
# Нужны в Settings → Secrets and variables → Actions:
#   Secrets:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
#   Variables: TEAM_ID, BUNDLE_ID
# Подробности — в README.md.
name: Выгрузка в TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия приложения, например 1.0.0 (пусто — взять из project.yml)"
        required: false
        default: ""
      upload:
        description: "Отправить сборку в App Store Connect"
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    name: Архив и выгрузка
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      VERSION_INPUT: ${{ inputs.version }}
      DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Проверить настройки
        run: |
          missing=0
          for name in TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задано значение $name (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          if [ "$BUNDLE_ID" = "com.example.bpdiary" ]; then
            echo "::error::BUNDLE_ID нужно заменить на собственный идентификатор приложения."
            missing=1
          fi
          exit $missing

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Установить XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Создать проект Xcode
        run: xcodegen generate

      - name: Подготовить ключ App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Секрет ASC_KEY_P8 должен содержать весь текст файла .p8, включая строки BEGIN и END."
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Архив подписывается «локальной» (ad-hoc) подписью: права приложения
      # (доступ к «Здоровью») сохраняются, а сертификат разработчика не нужен.
      # Настоящую подпись для App Store ставит следующий шаг.
      - name: Собрать архив
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "$VERSION_INPUT" ]; then
            EXTRA+=("MARKETING_VERSION=$VERSION_INPUT")
          fi
          xcodebuild archive \
            -project BPDiary.xcodeproj \
            -scheme BPDiary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BPDiary.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${EXTRA[@]}" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Проверить права приложения в архиве
        run: |
          APP="$RUNNER_TEMP/BPDiary.xcarchive/Products/Applications/BPDiary.app"
          : > "$RUNNER_TEMP/entitlements.txt"
          codesign -d --entitlements - --xml "$APP" >> "$RUNNER_TEMP/entitlements.txt" 2>/dev/null || true
          codesign -d --entitlements :- "$APP" >> "$RUNNER_TEMP/entitlements.txt" 2>/dev/null || true
          if ! grep -a -q "com.apple.developer.healthkit" "$RUNNER_TEMP/entitlements.txt"; then
            echo "::error::В архиве нет права доступа к «Здоровью» (HealthKit). Выгрузка остановлена."
            exit 1
          fi
          echo "Право доступа к «Здоровью» на месте."

      - name: Подписать и выгрузить
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BPDiary.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log"

      - name: Итог
        if: success()
        run: |
          {
            echo "## Готово"
            if [ "$DESTINATION" = "upload" ]; then
              echo "Сборка №${{ github.run_number }} отправлена в App Store Connect."
              echo "Через 10–30 минут она появится в разделе TestFlight."
            else
              echo "Сборка №${{ github.run_number }} подписана, но не отправлена (режим проверки)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Показать ошибки
        if: failure()
        run: |
          {
            echo "## Ошибки"
            echo
            echo '```'
            cat "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" 2>/dev/null \
              | grep -E "(error:|Error Domain|\*\* ARCHIVE FAILED \*\*|\*\* EXPORT FAILED \*\*)" \
              | sort -u | head -n 150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Удалить ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Сохранить журналы
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14
