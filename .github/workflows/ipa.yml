# Собирает файл BPDiary.ipa для установки на собственный iPhone с компьютера
# (например, программой Sideloadly с обычным Apple ID). Учётная запись
# разработчика не нужна. Готовый файл появляется в разделе Releases репозитория.
# Запуск вручную: вкладка Actions → «Файл для установки на iPhone (IPA)» → Run workflow.
name: Файл для установки на iPhone (IPA)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Машина для сборки"
        type: choice
        default: macos-26-intel
        options:
          - macos-26-intel
          - macos-26

jobs:
  ipa:
    name: Сборка IPA
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Установить XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Установить Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain уже установлен или недоступен"

      - name: Создать проект Xcode
        run: xcodegen generate

      # Архив подписывается «локальной» подписью без сертификата Apple;
      # права приложения (доступ к «Здоровью») при этом сохраняются.
      # Настоящую подпись ставит программа установки на компьютере.
      - name: Собрать архив
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BPDiary.xcodeproj \
            -scheme BPDiary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BPDiary.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 30

      - name: Упаковать IPA
        run: |
          APP="$RUNNER_TEMP/BPDiary.xcarchive/Products/Applications/BPDiary.app"
          echo "Права приложения в сборке:"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          echo
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" "$APP/Info.plist"
          lipo -info "$APP/BPDiary"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/BPDiary.ipa" Payload
          ls -l "$RUNNER_TEMP/BPDiary.ipa"

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/BPDiary.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Тестовая сборка №${{ github.run_number }}" \
            --notes "Файл BPDiary.ipa для установки на собственный iPhone с компьютера. Как установить — в README, раздел «Установка на один iPhone без учётной записи разработчика»."

      - name: Показать ошибки
        if: failure()
        run: |
          grep -E "(error:|\*\* ARCHIVE FAILED \*\*)" "$RUNNER_TEMP/archive.log" | sort -u | head -n 100 || true
