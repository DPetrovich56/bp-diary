# Проверочная сборка: компилирует приложение для симулятора iPhone.
# Учётная запись Apple для неё не нужна.
name: Проверочная сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Машина для сборки (если одна долго стоит в очереди — выберите другую)"
        type: choice
        default: macos-26-intel
        options:
          - macos-26-intel
          - macos-26

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка для симулятора
    # У GitHub два вида Mac. Для проверки кода подходит любой; по умолчанию берём
    # Intel — очередь на них обычно короче.
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 60
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Установить XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Установить Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain уже установлен или недоступен"

      - name: Создать проект Xcode
        run: xcodegen generate

      - name: Собрать приложение
        run: |
          set -o pipefail
          xcodebuild build \
            -project BPDiary.xcodeproj \
            -scheme BPDiary \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Показать ошибки компиляции
        if: failure()
        run: |
          {
            echo "## Ошибки сборки"
            echo
            echo '```'
            grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" "$RUNNER_TEMP/build.log" | sort -u | head -n 150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14
